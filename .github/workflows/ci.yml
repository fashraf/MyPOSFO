name: CI
on:
  pull_request:
  push:
    branches: [develop, main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: web-dist, path: dist }
      - name: Docker image builds
        run: docker build -t mypos-web:ci .
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Front-end sanity on the built app (mock data)
        run: |
          pip install -q -r qa/requirements.txt && python -m playwright install --with-deps chromium
          npx vite preview --port 4173 --strictPort &
          npx wait-on http://localhost:4173 -t 60000
          python qa/run_sanity.py --base http://localhost:4173 --env ci --only frontend --out qa-out
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ci-sanity-report, path: qa-out/ }
