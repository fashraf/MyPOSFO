name: Health check
# Every hour: quick read-only check of PRODUCTION (site, API, database, disk, backup age).
# A failure opens a GitHub issue ([HLT-MAJ-01] …) and GitHub emails you; it closes itself when healthy again.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      environment: { type: choice, options: [production, staging], default: production }
permissions:
  contents: read
  issues: write
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Server access
        run: |
          e=${{ inputs.environment || 'production' }}
          mkdir -p ~/.ssh && printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id && chmod 600 ~/.ssh/id
          host=${{ secrets.DEPLOY_HOST_PRODUCTION }}; port=""; [[ "$e" == staging ]] && host=${{ secrets.DEPLOY_HOST_STAGING }} && port=":8080"
          { echo "QA_SSH=ssh -i $HOME/.ssh/id -o StrictHostKeyChecking=accept-new -p ${{ secrets.DEPLOY_PORT || '22' }} ${{ secrets.DEPLOY_USER || 'root' }}@$host"
            echo "QA_BASE_URL=http://$host$port"; echo "QA_ENV=$e"; } >> "$GITHUB_ENV"
      - name: Health check
        run: pip install -q -r qa/requirements.txt && python -m playwright install --with-deps chromium && python qa/run_sanity.py --suite health --out qa-out
        env:
          QA_TRIGGER: hourly health check
          QA_TARGET: ${{ vars.DEPLOY_TARGET || 'linux' }}
      - name: Sync issues
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: python qa/sync_issues.py qa-out/findings.json --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "health-${{ github.run_number }}", path: qa-out/, retention-days: 7 }
